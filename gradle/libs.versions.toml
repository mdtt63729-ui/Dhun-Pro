firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics", version = "20.0.1" }

[bundles]
androidx = [
    "androidx-core-ktx", "androidx-appcompat", "androidx-activity", "fragment",
    "recyclerview", "swiperefresh",
    "splashscreen", "palette",
    "preference",
    "androidx-core-google-shortcuts"
]
paging = ["paging-common", "paging-runtime"]
room = ["room-runtime", "room-ktx"]
koin = ["koin-androidx-startup", "koin-android", "koin-androidx-workmanager"]
media3 = ["media3-exoplayer", "media3-session", "media3-ui", "media3-dash", "media3-hls"]
coil = ["coil", "coil-gif", "coil-svg", "coil-network-okhttp"]
compose = ["compose-ui", "compose-ui-graphics", "compose-ui-tooling-preview", "compose-foundation", "compose-material3", "compose-material-icons", "compose-runtime", "activity-compose", "compose-navigation", "compose-viewmodel", "compose-livedata", "compose-shimmer"]
kotlinx = ["kotlinx-serialization-json", "kotlinx-coroutines-core"]
firebase = ["firebase-analytics", "firebase-crashlytics"]
lyrics-network = ["ktor-client-core", "ktor-client-okhttp", "ktor-client-content-negotiation", "ktor-client-encoding", "ktor-client-websockets", "ktor-serialization-json", "ktor-server-core", "ktor-server-cio", "ktor-server-websockets", "timber"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
