name: Build Unsigned Release APK

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Unsigned Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify unsigned APK exists
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          echo "Unsigned APK: $APK"
          ls -lh "$APK"
          echo "APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Prepare artifact name
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/Dhun-release-unsigned.apk

      - name: Upload unsigned release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dhun-release-unsigned
          path: app/build/outputs/apk/release/Dhun-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish unsigned APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: app/build/outputs/apk/release/Dhun-release-unsigned.apk
