name: Signed Release

# Builds a SIGNED release APK using the keystore stored in the repository's Actions secrets,
# then publishes it to a GitHub Release so it can be downloaded directly.
#
# Secrets used (already added to this repository):
#   SIGNING_KEY_STORE_BASE64  the keystore, base64 encoded
#   SIGNING_STORE_PASSWORD    keystore password
#   SIGNING_KEY_ALIAS         key alias inside the keystore
#   SIGNING_KEY_PASSWORD      key password
#
# Download link (stable, overwritten on every run):
#   https://github.com/mdtt63729-ui/Dhun-Pro/releases/download/latest/DhunPro-signed-release.apk

on:
  workflow_dispatch: { }
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Ships the YouTube Music extension inside the APK, exactly like the Build APKs workflow.
      - name: Bundle the YouTube Music extension
        run: |
          mkdir -p app/src/main/assets/extensions
          curl -sSL --retry 3 -o app/src/main/assets/extensions/yt.apk \
            https://github.com/brahmkshatriya/echo-youtube-extension-old/releases/download/v3002c5d/yt-3002c5d.eapk
          ls -la app/src/main/assets/extensions/

      - name: Decode the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEY_STORE_BASE64 secret is missing"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/echo-release.jks"
          ls -la "$RUNNER_TEMP/echo-release.jks"

      - name: Build signed release
        env:
          SIGNING_KEY_STORE_PATH: ${{ runner.temp }}/echo-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify the APK is signed
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Built: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"
          mkdir -p out
          cp "$APK" out/DhunPro-signed-release.apk
          ls -la out/

      - name: Publish to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=latest
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Dhun Pro — latest signed build" \
              --notes "Signed release build. The APK below is installed over any earlier Dhun Pro build because it is signed with the same key."
          gh release upload "$TAG" out/DhunPro-signed-release.apk --clobber
          echo "Download: https://github.com/${{ github.repository }}/releases/download/$TAG/DhunPro-signed-release.apk"

      - name: Upload the APK as a workflow artifact too
        uses: actions/upload-artifact@v4
        with:
          name: dhunpro-signed-release
          path: out/DhunPro-signed-release.apk
