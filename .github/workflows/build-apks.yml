name: Build APKs

# Builds BOTH a debug APK and an unsigned release APK on every push.
# Grab them from the run's "Artifacts" section.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: { }

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # The build script reads the git hash/count for the version name.
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Ships the YouTube Music extension inside the APK, so it is already installed on first
      # launch instead of having to be added by hand.
      # Ships the YouTube Music and JioSaavn extensions inside the APK, so both are already
      # installed on first launch instead of having to be added by hand.
      - name: Bundle the YouTube Music and JioSaavn extensions
        run: |
          mkdir -p app/src/main/assets/extensions
          curl -sSL --retry 3 -o app/src/main/assets/extensions/yt.apk \
            https://github.com/brahmkshatriya/echo-youtube-extension-old/releases/download/v3002c5d/yt-3002c5d.eapk
          curl -sSL --retry 3 -o app/src/main/assets/extensions/saavn.apk \
            https://github.com/mdtt63729-ui/Dhun-Pro/releases/download/latest/saavn.apk
          ls -la app/src/main/assets/extensions/

      - name: Build debug and unsigned release
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
